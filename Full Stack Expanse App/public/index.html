<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense Tracker</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --bg: #0f0f0f;
            --surface: #1a1a1a;
            --border: #2a2a2a;
            --accent: #c8f135;
            --text: #f0f0f0;
            --muted: #666;
            --danger: #ff4444;
        }
        body { background: var(--bg); color: var(--text); font-family: 'DM Sans', sans-serif; min-height: 100vh; padding: 40px 20px; }
        .container { max-width: 780px; margin: 0 auto; }
        header { display: flex; align-items: baseline; gap: 16px; margin-bottom: 48px; border-bottom: 1px solid var(--border); padding-bottom: 24px; }
        h1 { font-family: 'Space Mono', monospace; font-size: 28px; font-weight: 700; letter-spacing: -1px; color: var(--accent); }
        .subtitle { font-size: 13px; color: var(--muted); font-family: 'Space Mono', monospace; }
        .form-card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 28px; margin-bottom: 40px; }
        .form-title { font-family: 'Space Mono', monospace; font-size: 13px; color: var(--muted); text-transform: uppercase; letter-spacing: 2px; margin-bottom: 20px; }
        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 14px; }
        .form-group { display: flex; flex-direction: column; gap: 6px; }
        label { font-size: 12px; color: var(--muted); font-family: 'Space Mono', monospace; text-transform: uppercase; letter-spacing: 1px; }
        input, select { background: var(--bg); border: 1px solid var(--border); border-radius: 8px; padding: 10px 14px; color: var(--text); font-family: 'DM Sans', sans-serif; font-size: 14px; outline: none; transition: border-color 0.2s; width: 100%; }
        input:focus, select:focus { border-color: var(--accent); }
        select option { background: var(--surface); }
        .btn-submit { width: 100%; padding: 12px; background: var(--accent); color: #0f0f0f; border: none; border-radius: 8px; font-family: 'Space Mono', monospace; font-size: 13px; font-weight: 700; cursor: pointer; letter-spacing: 1px; transition: opacity 0.2s; }
        .btn-submit:hover { opacity: 0.9; }
        .expenses-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
        .expenses-title { font-family: 'Space Mono', monospace; font-size: 13px; color: var(--muted); text-transform: uppercase; letter-spacing: 2px; }
        .total-badge { font-family: 'Space Mono', monospace; font-size: 13px; color: var(--accent); background: rgba(200,241,53,0.1); padding: 4px 12px; border-radius: 20px; border: 1px solid rgba(200,241,53,0.2); }
        #expense-list { display: flex; flex-direction: column; gap: 10px; }
        .expense-item { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 16px 20px; display: flex; align-items: center; justify-content: space-between; animation: slideIn 0.2s ease; }
        @keyframes slideIn { from { opacity: 0; transform: translateY(-8px); } to { opacity: 1; transform: translateY(0); } }
        .expense-left { display: flex; flex-direction: column; gap: 4px; }
        .expense-title-text { font-size: 15px; font-weight: 500; }
        .expense-meta { display: flex; gap: 10px; align-items: center; }
        .expense-category { font-size: 11px; font-family: 'Space Mono', monospace; color: var(--muted); background: var(--bg); padding: 2px 8px; border-radius: 4px; border: 1px solid var(--border); }
        .expense-date { font-size: 11px; color: var(--muted); font-family: 'Space Mono', monospace; }
        .expense-right { display: flex; align-items: center; gap: 16px; }
        .expense-amount { font-family: 'Space Mono', monospace; font-size: 16px; font-weight: 700; color: var(--accent); }
        .btn-actions { display: flex; gap: 8px; }
        .btn-delete, .btn-edit { background: none; border: 1px solid var(--border); border-radius: 6px; padding: 6px 12px; font-size: 12px; font-family: 'Space Mono', monospace; cursor: pointer; transition: all 0.2s; }
        .btn-delete { color: var(--danger); border-color: rgba(255,68,68,0.3); }
        .btn-delete:hover { background: rgba(255,68,68,0.1); border-color: var(--danger); }
        .btn-edit { color: var(--muted); }
        .btn-edit:hover { color: var(--text); border-color: var(--text); }
        .empty-state { text-align: center; padding: 48px; color: var(--muted); font-family: 'Space Mono', monospace; font-size: 13px; border: 1px dashed var(--border); border-radius: 10px; }
        .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 100; align-items: center; justify-content: center; }
        .modal-overlay.active { display: flex; }
        .modal { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 28px; width: 100%; max-width: 480px; margin: 20px; }
        .modal-title { font-family: 'Space Mono', monospace; font-size: 13px; color: var(--muted); text-transform: uppercase; letter-spacing: 2px; margin-bottom: 20px; }
        .modal-actions { display: flex; gap: 10px; margin-top: 16px; }
        .btn-cancel { flex: 1; padding: 10px; background: none; border: 1px solid var(--border); border-radius: 8px; color: var(--muted); font-family: 'Space Mono', monospace; font-size: 12px; cursor: pointer; }
        .btn-save { flex: 1; padding: 10px; background: var(--accent); border: none; border-radius: 8px; color: #0f0f0f; font-family: 'Space Mono', monospace; font-size: 12px; font-weight: 700; cursor: pointer; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>EXPENSES</h1>
            <span class="subtitle">// tracker</span>
        </header>

        <div class="form-card">
            <p class="form-title">// add new expense</p>
            <form id="expense-form">
                <div class="form-grid">
                    <div class="form-group">
                        <label>Title</label>
                        <input type="text" id="title" placeholder="e.g. Lunch" required />
                    </div>
                    <div class="form-group">
                        <label>Amount (₹)</label>
                        <input type="number" id="amount" placeholder="e.g. 500" required />
                    </div>
                    <div class="form-group">
                        <label>Category</label>
                        <select id="category">
                            <option value="Food">Food</option>
                            <option value="Transport">Transport</option>
                            <option value="Shopping">Shopping</option>
                            <option value="Entertainment">Entertainment</option>
                            <option value="Health">Health</option>
                            <option value="Other">Other</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Date</label>
                        <input type="date" id="date" required />
                    </div>
                </div>
                <button type="submit" class="btn-submit">ADD EXPENSE</button>
            </form>
        </div>

        <div class="expenses-header">
            <span class="expenses-title">// all expenses</span>
            <span class="total-badge" id="total">Total: ₹0</span>
        </div>

        <div id="expense-list"></div>
    </div>

    <!-- Edit Modal -->
    <div class="modal-overlay" id="edit-modal">
        <div class="modal">
            <p class="modal-title">// edit expense</p>
            <div class="form-grid">
                <div class="form-group">
                    <label>Title</label>
                    <input type="text" id="edit-title" />
                </div>
                <div class="form-group">
                    <label>Amount (₹)</label>
                    <input type="number" id="edit-amount" />
                </div>
                <div class="form-group">
                    <label>Category</label>
                    <select id="edit-category">
                        <option value="Food">Food</option>
                        <option value="Transport">Transport</option>
                        <option value="Shopping">Shopping</option>
                        <option value="Entertainment">Entertainment</option>
                        <option value="Health">Health</option>
                        <option value="Other">Other</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Date</label>
                    <input type="date" id="edit-date" />
                </div>
            </div>
            <div class="modal-actions">
                <button class="btn-cancel" id="cancel-edit">CANCEL</button>
                <button class="btn-save" id="save-edit">SAVE</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
